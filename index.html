
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIVITAS | Cidade Virtual</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 90%;
      max-width: 430px;
      padding: 35px;
      background: #1b293c;
      border: 1px solid #35445b;
      border-radius: 18px;
      text-align: center;
    }

    h1 {
      font-size: 38px;
      letter-spacing: 5px;
      margin-bottom: 5px;
    }

    p {
      color: #a8b7ca;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 1px solid #40516a;
      border-radius: 8px;
      background: #101827;
      color: white;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 8px;
      background: #25865c;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #30a673;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <main class="container">
    <h1>CIVITAS</h1>
    <p>Uma cidade. Uma comunidade. Uma sociedade.</p>

    <input type="email" placeholder="Seu e-mail">
    <input type="password" placeholder="Sua senha">

    <button>Entrar na cidade</button>
    <button>Criar minha conta</button>

    <div class="footer">
      CIVITAS © 2026 — Cidade Virtual
    </div>
  </main>

</body>
</html>
